# Builds the RAGX documentation static site and deploys it to Vercel.
#
# Flow (single job):
#   1. install deps   -> npm ci (reproducible, uses the committed lockfile)
#   2. build          -> npm run build  (tsc -b && vite build -> site/dist)
#   3. verify output  -> assert the key artifacts exist
#   4. deploy         -> Vercel CLI, prebuilt, production  (main only)
#
# Triggers: push to `main`, any pull request to `main`, and manual dispatch.
# The deploy step runs ONLY on the `main` branch, so pull requests build and
# validate the site without needing Vercel secrets.
#
# Required GitHub secrets (one-time, repo Settings -> Secrets and variables
# -> Actions):
#   - VERCEL_TOKEN       : Vercel -> Account -> Tokens -> create token
#   - VERCEL_ORG_ID      : Vercel -> your team -> Settings -> Team ID
#   - VERCEL_PROJECT_ID  : Vercel -> project -> Settings -> Project ID
#   - (optional) VERCEL_PROJECT_NAME: only needed on the very first deploy
#     when no project exists yet; lets `vercel pull` create/link it.

name: Deploy docs site to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_PROJECT_NAME: ${{ secrets.VERCEL_PROJECT_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 1. Install dependencies (reproducible from the committed lockfile).
      - name: Install dependencies
        run: npm ci

      # 2. Build the static site.
      - name: Build the site
        run: npm run build

      # 3. Verify the build produced the expected artifacts.
      - name: Verify build output
        run: |
          test -f site/dist/index.html
          test -f site/dist/interview-bank.html
          echo "Build output OK:"
          ls -1 site/dist

      # 4. Deploy to Vercel (production) — main branch only.
      - name: Install Vercel CLI
        if: github.ref == 'refs/heads/main'
        run: npm install --no-audit --no-fund -g vercel@latest

      # Pull the project config (org/project, env vars) into .vercel/.
      - name: Pull Vercel project config
        if: github.ref == 'refs/heads/main'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID"

      # Reproduce the exact build inside Vercel's environment (.vercel/output),
      # so what ships is built the same way Vercel will serve it.
      - name: Build prebuilt output
        if: github.ref == 'refs/heads/main'
        run: vercel build --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID"

      # Upload the prebuilt artifact to production.
      - name: Deploy to Vercel (production)
        if: github.ref == 'refs/heads/main'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID"
