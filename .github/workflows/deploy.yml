# Builds the RAGX documentation static site with GitHub Actions.
#
# The site is a self-contained Vite project under `site/` — its package.json,
# package-lock.json, vercel.json, vite.config.ts and tsconfig.json all live in
# that directory. All install/build steps therefore run with
# `working-directory: site`.
#
# Flow (single job):
#   1. install deps   -> npm ci in site/ (reproducible, uses the committed lockfile)
#   2. build          -> npm run build  (tsc -b && vite build -> site/dist)
#   3. verify output  -> assert the key artifacts exist
#   4. upload artifact-> upload site/dist so it can be previewed / inspected
#
# Deployment to Vercel is handled by Vercel's native Git integration — NO
# Actions secrets are required. On every push to `main`, Vercel builds the
# project with Root Directory = `site` (reads `site/vercel.json`:
# buildCommand + outputDirectory = `dist`) and deploys `site/dist`
# automatically. To enable it: in the Vercel dashboard, create a Project,
# import this GitHub repository and set the project's Root Directory to
# `site` (Vercel uses its own GitHub integration token — nothing to store in
# this repo's secrets).
#
# Triggers: push to `main`, any pull request to `main`, and manual dispatch.

name: Build docs site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # 1. Install dependencies (reproducible from the committed lockfile).
      - name: Install dependencies
        run: npm ci

      # 2. Build the static site.
      - name: Build the site
        run: npm run build

      # 3. Verify the build produced the expected artifacts.
      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/interview-bank.html
          echo "Build output OK:"
          ls -1 dist

      # 4. Upload the build artifact for preview / inspection.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          if-no-files-found: error
